<body><svg id="v" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="voice_env_d4.js"></script>
<script>
const OL='#2b2140', SKIN='#f6c9a4', HAIR='#3a2a3f', HOOD='#ff8fa3', HOOD2='#e86a84';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>1-Math.pow(1-clamp(t),3);
const back=t=>{t=clamp(t);const c=2.2;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const P=(t,a,d)=>clamp((t-a)/d);
const speaking=t=>{const v=(window.VENV||[])[Math.floor(t*30)];return v!==undefined&&v>-28;};

/* ---------------- character ---------------- */
function eyes(expr,t){
  const blink=(t%3.1)<0.12;
  const L=[], br=(a,b,c,d)=>`<path d="M${a},${b} L${c},${d}" stroke="${OL}" stroke-width="10" stroke-linecap="round"/>`;
  const both=f=>[-1,1].map(s=>f(s)).join('');
  const open=s=>blink?`<path d="M${s*62-24},-330 Q${s*62},-322 ${s*62+24},-330" stroke="${OL}" stroke-width="9" fill="none" stroke-linecap="round"/>`
    :`<ellipse cx="${s*62}" cy="-330" rx="19" ry="25" fill="${OL}"/><circle cx="${s*62+6}" cy="-339" r="7" fill="#fff"/>`;
  switch(expr){
    case 'sad': return both(open)+both(s=>br(s*100,-378,s*32,-398))+both(s=>`<path d="M${s*62-30},-352 L${s*62+30},-352" stroke="${OL}" stroke-width="7" stroke-linecap="round" opacity=".55"/>`);
    case 'determined': return both(open)+both(s=>br(s*102,-405,s*30,-378));
    case 'sweat': return both(open)+both(s=>br(s*100,-385,s*32,-402));
    case 'shock': return both(s=>`<circle cx="${s*62}" cy="-330" r="34" fill="#fff" stroke="${OL}" stroke-width="7"/><circle cx="${s*62}" cy="-330" r="8" fill="${OL}"/>`)+both(s=>br(s*100,-415,s*35,-425));
    case 'cry': return both(s=>`<path d="M${s*62-28},-325 Q${s*62},-345 ${s*62+28},-325" stroke="${OL}" stroke-width="10" fill="none" stroke-linecap="round"/>`)+both(s=>br(s*100,-378,s*32,-400));
    case 'scream': return both(s=>`<path d="M${s*62-s*24},-352 L${s*62+s*22},-330 L${s*62-s*24},-308" stroke="${OL}" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
    case 'happy': return both(s=>`<path d="M${s*62-26},-322 Q${s*62},-352 ${s*62+26},-322" stroke="${OL}" stroke-width="10" fill="none" stroke-linecap="round"/>`);
    default: return both(open);
  }
}
function mouth(expr,t,talk){
  const open = talk && speaking(t);
  const dark=`fill="#5a1f33" stroke="${OL}" stroke-width="7"`;
  switch(expr){
    case 'sad': return open?`<ellipse cx="0" cy="-240" rx="22" ry="16" ${dark}/>`:`<path d="M-30,-232 Q0,-258 30,-232" stroke="${OL}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
    case 'determined': return `<rect x="-48" y="-262" width="96" height="40" rx="14" fill="#fff" stroke="${OL}" stroke-width="7"/><path d="M-48,-242 H48 M-16,-262 V-222 M16,-262 V-222" stroke="${OL}" stroke-width="5"/>`;
    case 'sweat': return `<path d="M-38,-240 q10,-12 19,0 t19,0 t19,0 t19,0" stroke="${OL}" stroke-width="8" fill="none" stroke-linecap="round"/>`;
    case 'shock': return `<ellipse cx="0" cy="-232" rx="${22+(open?4:0)}" ry="32" ${dark}/>`;
    case 'cry': { const w=Math.sin(t*30)*4; return `<path d="M-55,-255 Q0,${-275+w} 55,-255 Q48,-195 0,-195 Q-48,-195 -55,-255Z" ${dark}/><ellipse cx="0" cy="-208" rx="26" ry="10" fill="#ff7b93"/>`; }
    case 'scream': { const w=Math.sin(t*40)*6; return `<path d="M-62,-270 Q0,-285 62,-270 Q60,${-170+w} 0,${-170+w} Q-60,${-170+w} -62,-270Z" ${dark}/><ellipse cx="0" cy="${-188+w}" rx="32" ry="12" fill="#ff7b93"/>`; }
    case 'happy': return open?`<path d="M-40,-250 Q0,-250 40,-250 Q36,-205 0,-205 Q-36,-205 -40,-250Z" ${dark}/>`:`<path d="M-38,-250 Q0,-212 38,-250" stroke="${OL}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
    default: return open?`<ellipse cx="0" cy="-240" rx="22" ry="18" ${dark}/>`:`<path d="M-26,-246 Q0,-228 26,-246" stroke="${OL}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
  }
}
function arm(pts,hand=true){
  const d='M'+pts.map(p=>p.join(',')).join(' L');
  const h=pts[pts.length-1];
  return `<path d="${d}" stroke="${OL}" stroke-width="74" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${d}" stroke="${HOOD}" stroke-width="58" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  ${hand?`<circle cx="${h[0]}" cy="${h[1]}" r="34" fill="${SKIN}" stroke="${OL}" stroke-width="7"/>`:''}`;
}
function girl(o){
  const {x=540,y=1150,s=1,expr='neutral',t=0,talk=false,pose='down',tilt=0,shake=0,glow=false,tears=false,sweatDrop=false}=o;
  const by=Math.sin(t*3.5)*7, sx=shake?Math.sin(t*70)*shake:0;
  let arms='', front='';
  if(pose==='down'){arms=arm([[-185,-90],[-215,90],[-200,230]])+arm([[185,-90],[215,90],[200,230]]);}
  if(pose==='phone'){arms=arm([[-185,-90],[-205,80],[-70,40]])+arm([[185,-90],[205,80],[70,40]]);
    front=`<g transform="translate(0,-10)"><rect x="-78" y="-120" width="156" height="250" rx="26" fill="#1b1830" stroke="${OL}" stroke-width="7"/><rect x="-64" y="-104" width="128" height="214" rx="16" fill="#9fd8ff"/><circle cx="-70" cy="45" r="34" fill="${SKIN}" stroke="${OL}" stroke-width="7"/><circle cx="70" cy="45" r="34" fill="${SKIN}" stroke="${OL}" stroke-width="7"/></g>`;}
  if(pose==='fist'){const u=Math.sin(t*10)*12;arms=arm([[-185,-90],[-290,-20],[-250,-200+u]])+arm([[185,-90],[290,-20],[250,-200-u]]);}
  if(pose==='face'){arms=arm([[-185,-90],[-290,-60],[-175,-250]])+arm([[185,-90],[290,-60],[175,-250]]);}
  if(pose==='bowl'){arms=arm([[-185,-90],[-200,90],[-110,120]])+arm([[185,-90],[240,0],[110,-170]]);
    front=`<g><path d="M-170,90 Q0,320 170,90Z" fill="#f2f2f2" stroke="${OL}" stroke-width="8"/><path d="M-170,90 H170" stroke="${OL}" stroke-width="8"/><path d="M-150,95 q30,-25 60,0 t60,0 t60,0 t60,0 t60,0" stroke="#f3c15a" stroke-width="12" fill="none"/><rect x="-60" y="140" width="120" height="30" rx="10" fill="#ff6a3d" opacity=".9"/>
    <path d="M100,-150 L20,90" stroke="#b07a3c" stroke-width="10" stroke-linecap="round"/><path d="M125,-150 L50,92" stroke="#b07a3c" stroke-width="10" stroke-linecap="round"/>${[0,1,2].map(i=>`<path d="M${-80+i*70},${60-((t*90+i*40)%120)} q-18,-25 0,-50 t0,-50" stroke="#fff" stroke-width="8" fill="none" opacity="${.6-((t*90+i*40)%120)/240}" stroke-linecap="round"/>`).join('')}
    <circle cx="110" cy="-170" r="34" fill="${SKIN}" stroke="${OL}" stroke-width="7"/><circle cx="-110" cy="120" r="34" fill="${SKIN}" stroke="${OL}" stroke-width="7"/></g>`;}
  const tearSvg=tears?[-1,1].map(s=>{const k=(t*1.6+(s>0?.5:0))%1;return `<path d="M${s*70},-312 Q${s*95},-230 ${s*85},-140" stroke="#7cc8ff" stroke-width="16" fill="none" stroke-linecap="round" opacity=".9"/><path d="M${s*85},${-140+k*150} q-14,22 0,32 q14,-10 0,-32Z" fill="#7cc8ff" stroke="${OL}" stroke-width="4" opacity="${1-k}"/>`}).join(''):'';
  const drop=sweatDrop?`<path d="M168,${-470+Math.sin(t*6)*8} q-30,46 0,62 q30,-16 0,-62Z" fill="#8fd3ff" stroke="${OL}" stroke-width="6"/>`:'';
  return `<g transform="translate(${x+sx},${y+by}) scale(${s}) rotate(${tilt})">
   <ellipse cx="0" cy="335" rx="230" ry="26" fill="#000" opacity=".18"/>
   <g transform="rotate(${Math.sin(t*3)*6},140,-470)"><ellipse cx="205" cy="-380" rx="58" ry="125" transform="rotate(-25,205,-380)" fill="${HAIR}" stroke="${OL}" stroke-width="7"/><circle cx="150" cy="-480" r="30" fill="#ffd166" stroke="${OL}" stroke-width="7"/></g>
   <path d="M-150,-150 Q-215,-130 -228,10 L-238,330 L238,330 L228,10 Q215,-130 150,-150Z" fill="${HOOD}" stroke="${OL}" stroke-width="8"/>
   <path d="M-238,250 H238" stroke="${HOOD2}" stroke-width="14"/>
   <rect x="-36" y="-200" width="72" height="70" fill="${SKIN}" stroke="${OL}" stroke-width="7"/>
   <path d="M-125,-160 Q0,-80 125,-160" fill="none" stroke="${HOOD2}" stroke-width="22" stroke-linecap="round"/>
   <path d="M-40,-125 V-20 M40,-125 V-30" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
   <g transform="translate(0,80)"><path d="M0,30 C-70,-20 -50,-75 0,-45 C50,-75 70,-20 0,30Z" fill="#fff" stroke="${OL}" stroke-width="6"/><path d="M0,-45 L-10,-15 L8,0 L-4,25" stroke="${OL}" stroke-width="5" fill="none"/></g>
   ${arms}
   <circle cx="-168" cy="-310" r="30" fill="${SKIN}" stroke="${OL}" stroke-width="7"/><circle cx="168" cy="-310" r="30" fill="${SKIN}" stroke="${OL}" stroke-width="7"/>
   <ellipse cx="0" cy="-315" rx="170" ry="168" fill="${SKIN}" stroke="${OL}" stroke-width="8"/>
   <path d="M-172,-330 Q-175,-505 0,-500 Q175,-505 172,-330 Q150,-420 70,-415 Q40,-445 10,-405 Q-30,-445 -70,-405 Q-130,-430 -172,-330Z" fill="${HAIR}" stroke="${OL}" stroke-width="8" stroke-linejoin="round"/>
   <ellipse cx="-100" cy="-268" rx="30" ry="16" fill="#ff8fa3" opacity=".55"/><ellipse cx="100" cy="-268" rx="30" ry="16" fill="#ff8fa3" opacity=".55"/>
   ${eyes(expr,t)}${mouth(expr,t,talk)}${tearSvg}${drop}
   ${glow?`<ellipse cx="0" cy="-260" rx="175" ry="150" fill="#9fd8ff" opacity="${.16+Math.sin(t*9)*.03}"/>`:''}
   ${front}
  </g>`;
}

/* ---------------- backgrounds ---------------- */
function bedroom(t,dim=0){
  const stars=[[760,330],[930,300],[860,420],[990,470],[720,470]].map(([a,b],i)=>`<circle cx="${a}" cy="${b}" r="${5+2*Math.sin(t*3+i)}" fill="#fff6c9"/>`).join('');
  return `<defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232a52"/><stop offset="1" stop-color="#151a36"/></linearGradient></defs>
  <rect width="1080" height="1920" fill="url(#bg1)"/>
  <rect x="660" y="230" width="380" height="330" rx="18" fill="#0d1230" stroke="#3b4580" stroke-width="16"/>${stars}<circle cx="950" cy="345" r="42" fill="#ffe9a8"/><circle cx="932" cy="335" r="42" fill="#0d1230"/>
  <path d="M850,230 V560 M660,395 H1040" stroke="#3b4580" stroke-width="12"/>
  <rect x="40" y="300" width="220" height="150" rx="10" fill="#2f3768"/><path d="M60,430 L120,360 L170,410 L200,380 L240,430Z" fill="#454f8f"/>
  <rect x="0" y="1480" width="1080" height="440" fill="#3d4a8c"/><path d="M0,1480 Q540,1430 1080,1480" fill="#4b5aa6"/>
  <rect x="790" y="1350" width="230" height="130" rx="14" fill="#2b2f55"/><rect x="815" y="1375" width="180" height="70" rx="10" fill="#111"/><text x="905" y="1427" text-anchor="middle" font-size="50" font-weight="700" fill="#ff4d6d">02:${String(47+Math.floor(t/60)).padStart(2,'0')}</text>
  ${dim?`<rect width="1080" height="1920" fill="#000" opacity="${dim}"/>`:''}`;
}
function kitchen(t){
  return `<rect width="1080" height="1920" fill="#1f2a3d"/>
  <rect x="0" y="0" width="1080" height="160" fill="#18202f"/>
  <rect x="40" y="380" width="300" height="1100" rx="20" fill="#cfd8e3" stroke="#0e1420" stroke-width="10"/>
  <path d="M340,380 L520,450 V1420 L340,1480Z" fill="#fff8d6" opacity=".9"/><rect x="60" y="400" width="260" height="1060" fill="#fff6c4"/>
  <path d="M60,700 H320 M60,1000 H320" stroke="#e8d99a" stroke-width="10"/>
  <rect x="90" y="610" width="60" height="90" rx="8" fill="#7fd1b9"/><rect x="180" y="640" width="90" height="60" rx="8" fill="#ff9f68"/>
  <polygon points="340,380 1080,1300 1080,380" fill="#fff8d6" opacity=".05"/>
  <rect x="0" y="1480" width="1080" height="440" fill="#5b3f2e"/><rect x="0" y="1480" width="1080" height="30" fill="#7a5640"/>
  <text x="800" y="320" text-anchor="middle" font-size="44" fill="#ff4d6d" font-weight="700">02:13</text>`;
}
function phone(t,content){
  return `<rect width="1080" height="1920" fill="#141833"/>
  <circle cx="540" cy="960" r="${620+Math.sin(t*2)*15}" fill="#2a3170" opacity=".5"/>
  <g transform="translate(540,960) rotate(${Math.sin(t*1.5)*1.2}) translate(-540,-960)">
  <rect x="200" y="250" width="680" height="1420" rx="80" fill="#0c0c16" stroke="#3a3a55" stroke-width="10"/>
  <rect x="226" y="276" width="628" height="1368" rx="58" fill="#fafafa"/>
  <rect x="460" y="300" width="160" height="34" rx="17" fill="#0c0c16"/>
  ${content}</g>`;
}
function profileUI(t){
  return `<text x="270" y="420" font-size="40" font-weight="700" fill="#222">‹  ex.jaa_</text>
  <circle cx="340" cy="560" r="80" fill="#ffd1dc" stroke="#ff5c8a" stroke-width="8"/><circle cx="340" cy="535" r="30" fill="#b06b8b"/><path d="M285,610 Q340,560 395,610" fill="#b06b8b"/>
  <text x="470" y="555" font-size="40" font-weight="700" fill="#222">128</text><text x="590" y="555" font-size="40" font-weight="700" fill="#222">2.1k</text><text x="720" y="555" font-size="40" font-weight="700" fill="#222">540</text>
  <text x="470" y="600" font-size="26" fill="#666">โพสต์</text><text x="590" y="600" font-size="26" fill="#666">ผู้ติดตาม</text><text x="720" y="600" font-size="26" fill="#666">กำลังติดตาม</text>
  <text x="270" y="700" font-size="32" fill="#333">ชีวิตใหม่ ✨ ไม่หันหลังกลับ</text>
  ${Array.from({length:9}).map((_,i)=>`<rect x="${240+(i%3)*202}" y="${760+Math.floor(i/3)*202}" width="196" height="196" fill="${['#ffcad4','#cde7ff','#ffe5a8','#d8f3dc','#e4c1f9','#ffd6a5','#bde0fe','#fbc4ab','#caffbf'][i]}"/>`).join('')}`;
}
function couplePost(t,liked=0,thumb=null){
  const hs=liked?back(liked)*1:0;
  return `<text x="270" y="420" font-size="36" font-weight="700" fill="#222">ex.jaa_</text><circle cx="250" cy="408" r="0"/>
  <rect x="226" y="460" width="628" height="628" fill="#ffd6e0"/>
  <circle cx="440" cy="760" r="90" fill="#6b5b7b"/><rect x="350" y="840" width="180" height="248" rx="80" fill="#6b5b7b"/>
  <circle cx="640" cy="760" r="90" fill="#8a7a9a"/><rect x="550" y="840" width="180" height="248" rx="80" fill="#8a7a9a"/>
  ${[0,1,2].map(i=>`<path transform="translate(${470+i*70},${600-((t*60+i*30)%60)}) scale(.5)" d="M0,30 C-70,-20 -50,-75 0,-45 C50,-75 70,-20 0,30Z" fill="#ff5c8a"/>`).join('')}
  <g transform="translate(290,1160)"><path d="M0,30 C-70,-20 -50,-75 0,-45 C50,-75 70,-20 0,30Z" transform="scale(.75)" fill="${liked?'#ff3b5c':'none'}" stroke="${liked?'#ff3b5c':'#222'}" stroke-width="9"/></g>
  <text x="360" y="1180" font-size="34" fill="#222">💬  ↗</text>
  <text x="250" y="1260" font-size="32" font-weight="700" fill="#222">ex.jaa_ <tspan font-weight="400">คนนี้แหละ ใช่เลย 🤍</tspan></text>
  <text x="250" y="1310" font-size="28" fill="#888">เมื่อ 3 นาทีที่แล้ว</text>
  ${liked?`<g transform="translate(540,780) scale(${hs*2.6})" opacity="${1-P(liked,0.7,0.3)}"><path d="M0,30 C-70,-20 -50,-75 0,-45 C50,-75 70,-20 0,30Z" fill="#fff" opacity=".95"/></g>`:''}
  ${thumb?`<g transform="translate(${thumb[0]},${thumb[1]})"><ellipse cx="0" cy="0" rx="85" ry="110" fill="${SKIN}" stroke="${OL}" stroke-width="8"/><rect x="-85" y="0" width="170" height="600" fill="${SKIN}" stroke="${OL}" stroke-width="8"/><rect x="-77" y="-4" width="154" height="20" fill="${SKIN}"/><ellipse cx="0" cy="-55" rx="45" ry="38" fill="#ffe3d2" stroke="${OL}" stroke-width="5"/></g>`:''}`;
}

/* ---------------- overlays ---------------- */
function brokenHeart(t,cx,cy,k){ // k: 0..1 crack progress
  const sp=ease(P(k,0.35,0.5))*70, fall=Math.pow(P(k,0.5,0.5),2)*500;
  const half=(s)=>`<g transform="translate(${s*sp},${fall}) rotate(${s*ease(P(k,.35,.6))*18})"><path d="${s<0?'M0,60 C-140,-40 -100,-150 0,-90 L-20,-40 L15,-5 L-10,55Z':'M0,60 C140,-40 100,-150 0,-90 L-20,-40 L15,-5 L-10,55Z'}" fill="#ff3b5c" stroke="${OL}" stroke-width="9" stroke-linejoin="round"/></g>`;
  const sc=back(P(k,0,.3));
  return `<g transform="translate(${cx},${cy}) scale(${sc*1.6})">${half(-1)}${half(1)}</g>`;
}
function hud(day,moveon,bump){
  const col=moveon<0?'#ff6b81':'#7ee0b5';
  return `<g transform="translate(60,120)"><rect width="520" height="76" rx="12" fill="#0d1124" opacity=".82"/><rect width="8" height="76" fill="#7ee0b5"/>
  <text x="34" y="51" font-size="36" font-weight="700" fill="#fff">• เหลือ ${day} วัน</text>
  <g transform="translate(300,38) scale(${1+bump*.35}) translate(-300,-38)"><text x="300" y="51" font-size="36" font-weight="700" fill="${col}">มูฟออน ${moveon}%</text></g></g>`;
}
function wrapText(s){return s.split('\n');}
function sub(text,lt){
  const sc=back(P(lt,0,.22)), lines=wrapText(text);
  return `<g transform="translate(540,1300) scale(${sc})">${lines.map((l,i)=>`<text x="0" y="${(i-(lines.length-1)/2)*92}" text-anchor="middle" font-size="76" font-weight="800" fill="#fff" stroke="${OL}" stroke-width="18" paint-order="stroke" stroke-linejoin="round">${l}</text>`).join('')}</g>`;
}

/* ---------------- Day 4 timeline ---------------- */
const SUBS=[
 [0.25,1.3,'วันที่ 4...'],[1.3,3.3,'วันนี้จะฟังแต่เพลงสนุกๆ 🎧'],
 [3.3,4.3,'กดสุ่มเพลง...'],[4.3,5.5,'ได้เพลงอกหัก'],
 [5.5,6.2,'กดข้าม...'],[6.2,7.4,'อกหักอีก'],
 [7.45,8.15,'กดข้าม!!'],[8.15,10.3,'เพลงที่เราเคย\nร้องคู่กัน!!!'],
 [10.3,11.15,'หนีขึ้นแท็กซี่...'],[11.15,12.7,'ลุงเปิดเพลงเดียวกันเป๊ะ'],
 [12.75,15.2,'สุดท้ายนั่งร้องไห้\nกับลุงทั้งคัน 😭'],
 [15.3,16.5,'จบวันที่ 4'],[16.5,19.1,'มูฟออนติดลบ 40%'],
];
const END=25;
function moveonAt(t){return t<16.6?-30:-40;}
function bumpAt(t){const a=16.6;return (t>=a&&t<a+.4)?Math.sin((t-a)/.4*Math.PI):0;}
const punch=lt=>1+0.06*(1-ease(P(lt,0,.35)));
function thumb(x,y){return `<g transform="translate(${x},${y})"><ellipse cx="0" cy="0" rx="85" ry="110" fill="${SKIN}" stroke="${OL}" stroke-width="8"/><rect x="-85" y="0" width="170" height="700" fill="${SKIN}" stroke="${OL}" stroke-width="8"/><rect x="-77" y="-4" width="154" height="20" fill="${SKIN}"/><ellipse cx="0" cy="-55" rx="45" ry="38" fill="#ffe3d2" stroke="${OL}" stroke-width="5"/></g>`;}
function headphones(x,y,s,t){return `<g transform="translate(${x},${y+Math.sin(t*3.5)*7}) scale(${s})"><path d="M-178,-330 Q-190,-560 0,-560 Q190,-560 178,-330" fill="none" stroke="${OL}" stroke-width="40" stroke-linecap="round"/><path d="M-178,-330 Q-190,-560 0,-560 Q190,-560 178,-330" fill="none" stroke="#7c6cd6" stroke-width="24" stroke-linecap="round"/><rect x="-215" y="-400" width="70" height="140" rx="30" fill="#7c6cd6" stroke="${OL}" stroke-width="8"/><rect x="145" y="-400" width="70" height="140" rx="30" fill="#7c6cd6" stroke="${OL}" stroke-width="8"/></g>`;}
function notes(t,cx,cy,col='#fff',n=5){return Array.from({length:n}).map((_,i)=>{const k=(t*.5+i/n)%1;return `<text x="${cx+Math.sin(t*2+i*2)*260}" y="${cy-k*420}" font-size="${70+i%2*20}" fill="${col}" opacity="${1-k}" text-anchor="middle">${i%2?'♪':'♫'}</text>`;}).join('');}
function street(t){
  const win=[];for(let b=0;b<5;b++)for(let r=0;r<6;r++)for(let c=0;c<2;c++)win.push(`<rect x="${b*220+30+c*70}" y="${560+r*110+(b%2)*60}" width="45" height="60" fill="${(b*7+r*3+c)%4?'#ffe08a':'#3a3f6b'}" opacity=".8"/>`);
  return `<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a8b"/><stop offset=".6" stop-color="#ffc3a0"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#sk)"/>
  ${[0,1,2,3,4].map(b=>`<rect x="${b*220}" y="${500+(b%2)*60}" width="200" height="1000" fill="${['#5b4b8a','#6d5ba3','#4f437a','#665597','#574a86'][b]}"/>`).join('')}${win.join('')}
  <rect y="1480" width="1080" height="440" fill="#8c8c9e"/><rect y="1480" width="1080" height="24" fill="#a7a7b8"/>`;
}
const SONGS=[
 {t0:0,   title:'ลืมไม่ลง 💔', artist:'วงน้ำตาริน', c1:'#4a6fa5',c2:'#9bb7d4',icon:'🌧️'},
 {t0:5.7, title:'อกหักซ้ำซาก', artist:'คนเดิม เพิ่มเติมคือเจ็บ', c1:'#5e548e',c2:'#b8a9c9',icon:'🥀'},
 {t0:7.65,title:'เพลงของเรา (Duet)', artist:'เรา ❤️ เขา', c1:'#ff5c8a',c2:'#ffc2d1',icon:'🎤'},
];
function playerUI(t){
  const song=[...SONGS].reverse().find(s=>t>=s.t0);
  const age=t-song.t0, pop=back(P(age,0,.3));
  const btn=(x,label,on)=>`<circle cx="${x}" cy="1480" r="${on?58:50}" fill="${on?'#ffe3ec':'none'}"/><text x="${x}" y="1502" text-anchor="middle" font-size="${label==='▶'?70:56}" fill="#222">${label}</text>`;
  const shuffleOn=t>=3.6&&t<3.8, skip1=t>=5.6&&t<5.8, skip2=t>=7.55&&t<7.75;
  return `<text x="540" y="400" text-anchor="middle" font-size="34" fill="#888">กำลังเล่น · สุ่มเพลง</text>
  <g transform="translate(540,700) scale(${pop})"><rect x="-260" y="-260" width="520" height="520" rx="30" fill="${song.c1}"/><circle cx="0" cy="0" r="200" fill="${song.c2}" opacity=".6"/><text y="60" text-anchor="middle" font-size="190">${song.icon}</text></g>
  <text x="290" y="1060" font-size="52" font-weight="800" fill="#222">${song.title}</text><text x="290" y="1115" font-size="34" fill="#777">${song.artist}</text>
  <rect x="290" y="1170" width="500" height="10" rx="5" fill="#e5e5e5"/><rect x="290" y="1170" width="${Math.min(500,age*90)}" height="10" rx="5" fill="#ff5c8a"/>
  ${btn(320,'🔀',shuffleOn)}${btn(430,'⏮',false)}${btn(540,'▶',false)}${btn(650,'⏭',skip1||skip2)}${btn(760,'🔁',false)}`;
}
function uncle(x,y,s,t,cry){
  const tear=cry?[-1,1].map(sg=>{const k=(t*1.8+(sg>0?.4:0))%1;return `<path d="M${sg*45},-10 Q${sg*60},60 ${sg*55},130" stroke="#7cc8ff" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M${sg*55},${130+k*90} q-12,18 0,27 q12,-9 0,-27Z" fill="#7cc8ff" opacity="${1-k}"/>`}).join(''):'';
  return `<g transform="translate(${x},${y+Math.sin(t*3)*4}) scale(${s})">
   <path d="M-210,160 Q-200,90 -120,80 L120,80 Q200,90 210,160 L220,420 L-220,420Z" fill="#9ed4f5" stroke="${OL}" stroke-width="8"/><path d="M-50,80 L0,170 L50,80" fill="#fff" stroke="${OL}" stroke-width="6"/>
   <circle cx="-130" cy="-20" r="28" fill="#e0a77e" stroke="${OL}" stroke-width="7"/><circle cx="130" cy="-20" r="28" fill="#e0a77e" stroke="${OL}" stroke-width="7"/>
   <ellipse cx="0" cy="-30" rx="135" ry="145" fill="#e0a77e" stroke="${OL}" stroke-width="8"/>
   <path d="M-135,-40 Q-140,-110 -95,-130 M135,-40 Q140,-110 95,-130" stroke="#c9c9c9" stroke-width="26" fill="none" stroke-linecap="round"/>
   <path d="M-25,-170 q10,-25 20,0" stroke="${OL}" stroke-width="5" fill="none"/>
   ${cry?`<path d="M-75,-30 Q-50,-48 -25,-30 M25,-30 Q50,-48 75,-30" stroke="${OL}" stroke-width="9" fill="none" stroke-linecap="round"/>`:`<circle cx="-50" cy="-35" r="11" fill="${OL}"/><circle cx="50" cy="-35" r="11" fill="${OL}"/>`}
   <path d="M-85,-70 L-25,${cry?-58:-75} M25,${cry?-58:-75} L85,-70" stroke="#888" stroke-width="10" stroke-linecap="round"/>
   <path d="M-70,25 Q-35,5 0,20 Q35,5 70,25 Q35,45 0,35 Q-35,45 -70,25Z" fill="#555" stroke="${OL}" stroke-width="5"/>
   ${cry?`<path d="M-35,75 Q0,45 35,75 Q0,95 -35,75Z" fill="#5a1f33" stroke="${OL}" stroke-width="5"/>`:`<path d="M-25,65 Q0,80 25,65" stroke="${OL}" stroke-width="7" fill="none" stroke-linecap="round"/>`}
   ${tear}</g>`;
}
function taxi(t,cry){
  const lights=Array.from({length:10}).map((_,i)=>{const x=((i*170-t*500)%1700+1700)%1700-300;return `<circle cx="${x}" cy="${380+(i%3)*60}" r="${28+(i%2)*12}" fill="${['#ffd166','#ff8fa3','#7ee0b5'][i%3]}" opacity=".55"/>`;}).join('');
  const radio=`<g transform="translate(540,1600)"><rect x="-230" y="-70" width="460" height="140" rx="16" fill="#111" stroke="#444" stroke-width="6"/><text y="18" text-anchor="middle" font-size="44" font-weight="700" fill="#7ee0b5">♪ เพลงของเรา (Duet)</text></g>`;
  return `<rect width="1080" height="1920" fill="#1a1630"/><rect x="40" y="250" width="1000" height="480" rx="40" fill="#22284f"/>${lights}
  <path d="M40,250 H1040 V730 H40Z" fill="none" stroke="#e44f7a" stroke-width="30"/><rect x="0" y="730" width="1080" height="1190" fill="#e44f7a"/><rect x="0" y="730" width="1080" height="40" fill="#c43c64"/>
  <text x="540" y="225" text-anchor="middle" font-size="48" font-weight="800" fill="#ffd166">TAXI-METER</text>
  <rect x="80" y="840" width="380" height="640" rx="60" fill="#3d3550" stroke="${OL}" stroke-width="8"/>
  ${uncle(270,1050,1,t,cry)}
  <rect x="0" y="1480" width="1080" height="440" fill="#2b2338"/>${radio}
  ${notes(t,560,1450,'#7ee0b5',4)}`;
}
function scene(t){
  let s='';
  const W=(lt,inner)=>`<g transform="translate(540,960) scale(${punch(lt)}) translate(-540,-960)">${inner}</g>`;
  if(t<3.3){ s=W(t,street(t)+notes(t,540,700,'#fff',5)+girl({t,expr:'happy',pose:'down',y:1150,talk:true})+headphones(540,1150,1,t)); }
  else if(t<8.15){ const lt=t-3.3;
    let tp=[700,1950];
    if(t<3.6) tp=[320+380*(1-ease(P(t,3.3,.3))),1950-ease(P(t,3.3,.3))*420];
    else if(t<5.4) tp=[320,1530+(t<3.8?0:ease(P(t,3.9,.4))*600)];
    else if(t<7.4) tp=[650,t<5.6?1950-ease(P(t,5.4,.2))*420:1530+(t<5.8?0:ease(P(t,6.3,.4))*600)];
    else tp=[650,t<7.55?1950-ease(P(t,7.4,.15))*420:1530];
    const sad=t>=4.3;
    s=W(lt,phone(t,playerUI(t)+thumb(tp[0],tp[1]+60)));
    if(t>=6.2&&t<7.45) s+=`<g transform="translate(540,1780) scale(${back(P(t,6.2,.3))})"><text text-anchor="middle" font-size="64" font-weight="800" fill="#ff8fa3" stroke="${OL}" stroke-width="10" paint-order="stroke">อีกแล้ว?! 😩</text></g>`; }
  else if(t<10.3){ const lt=t-8.15;
    const cover=`<g transform="translate(540,480) rotate(${-6+Math.sin(t*8)*3}) scale(${back(P(lt,0,.3))})"><rect x="-200" y="-200" width="400" height="400" rx="24" fill="#ff5c8a" stroke="#fff" stroke-width="14"/><circle cx="-60" cy="-20" r="55" fill="#6b5b7b"/><rect x="-115" y="35" width="110" height="140" rx="50" fill="#6b5b7b"/><circle cx="60" cy="-20" r="55" fill="#8a7a9a"/><rect x="5" y="35" width="110" height="140" rx="50" fill="#8a7a9a"/><text y="-120" text-anchor="middle" font-size="70">🎤</text></g>`;
    s=W(lt,`<rect width="1080" height="1920" fill="#2a1d4a"/>`+Array.from({length:12}).map((_,i)=>`<path d="M540,960 L${540+1600*Math.cos(i/12*Math.PI*2+t)},${960+1600*Math.sin(i/12*Math.PI*2+t)} L${540+1600*Math.cos((i+.5)/12*Math.PI*2+t)},${960+1600*Math.sin((i+.5)/12*Math.PI*2+t)}Z" fill="#ff3b5c" opacity=".25"/>`).join('')
      +cover+girl({t,expr:'scream',pose:'face',y:1300,s:.95,shake:7})+headphones(540,1300,.95,t)); }
  else if(t<12.7){ s=W(t-10.3,taxi(t,false)+girl({t,expr:t<11.15?'sweat':'shock',pose:'down',x:780,y:1230,s:.85,talk:t<11.15,sweatDrop:t<11.15})); }
  else if(t<15.2){ s=W(t-12.7,taxi(t,true)+girl({t,expr:'cry',pose:'down',x:780,y:1230,s:.85,tears:true})); }
  else if(t<19.2){ const lt=t-15.2;
    s=W(lt,bedroom(t,.2)+`<g transform="translate(540,1480)"><path d="M-420,0 Q-430,-300 -200,-330 Q0,-380 200,-330 Q430,-300 420,0Z" fill="#7d8ad6" stroke="${OL}" stroke-width="10"/></g>`
      +`<g transform="translate(540,${1200+Math.sin(t*2)*6})"><ellipse cx="0" cy="-60" rx="170" ry="130" fill="${SKIN}" stroke="${OL}" stroke-width="8"/><path d="M-172,-60 Q-175,-215 0,-210 Q175,-215 172,-60 Q120,-140 0,-130 Q-120,-140 -172,-60Z" fill="${HAIR}" stroke="${OL}" stroke-width="8"/><path d="M-90,-40 Q-62,-25 -34,-40 M34,-40 Q62,-25 90,-40" stroke="${OL}" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M-300,30 Q0,-40 300,30 L300,120 L-300,120Z" fill="#7d8ad6" stroke="${OL}" stroke-width="10"/></g>`
      +`<g transform="translate(300,700) rotate(-6)" opacity="${P(t,15.6,.3)}"><rect x="-170" y="-55" width="340" height="110" rx="20" fill="#fff" stroke="${OL}" stroke-width="6"/><text y="15" text-anchor="middle" font-size="40" fill="${OL}">🔇 ปิดเพลงทั้งคืน</text></g>`
      +`<text x="760" y="${900-((t*40)%120)}" font-size="${60+((t*40)%120)/3}" font-weight="800" fill="#cfd6ff" opacity="${1-((t*40)%120)/120}">Z</text>`); }
  else { const lt=t-19.2;
    s=`<rect width="1080" height="1920" fill="#1b2340"/>`
     +`<g transform="translate(540,760) rotate(-3) scale(${back(P(lt,0,.4))})"><rect x="-380" y="-95" width="760" height="190" rx="18" fill="#2e7d5b" stroke="#fff" stroke-width="10"/><text y="28" text-anchor="middle" font-size="88" font-weight="800" fill="#fff">วันที่ 5 เริ่มแล้ว</text></g>`
     +`<text x="540" y="930" text-anchor="middle" font-size="46" font-weight="700" fill="#7ee0b5" opacity="${P(lt,.3,.3)}">เหลือ 26 วัน</text>`
     +`<g opacity="${P(t,20.65,.3)}"><text x="540" y="1220" text-anchor="middle" font-size="54" font-weight="700" fill="#fff">ตอนหน้า: หมูกระทะ 🥓🔥</text><text x="540" y="1300" text-anchor="middle" font-size="54" font-weight="700" fill="#ffd166" opacity="${P(t,21.3,.3)}">ช่วยได้ไหม...?</text></g>`
     +`<g opacity="${P(t,22.6,.3)}" transform="translate(540,1520) scale(${1+Math.sin(lt*6)*.04})"><rect x="-290" y="-60" width="580" height="120" rx="60" fill="#ff3b5c"/><text y="20" text-anchor="middle" font-size="50" font-weight="800" fill="#fff">กดติดตาม ไม่งั้นพลาด!</text></g>`;
  }
  if(t<19.2) s+=hud(27,moveonAt(t),bumpAt(t));
  const cur=SUBS.find(([a,b])=>t>=a&&t<b); if(cur) s+=sub(cur[2],t-cur[0]);
  return s;
}
window.renderAt=t=>{document.getElementById('v').innerHTML=scene(t);};
window.DURATION=END;
renderAt(0);
</script></body></html>
